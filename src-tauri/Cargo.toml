[package]
name = "rom-ingest-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rom_ingest_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1.10"
sha1 = "0.10"
trash = "5.2"
thiserror = "2.0"
tauri = { version = "2", features = [] }
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mock_chdman"
path = "tests/bin/mock_chdman.rs"

[build-dependencies]
tauri-build = { version = "2" }
