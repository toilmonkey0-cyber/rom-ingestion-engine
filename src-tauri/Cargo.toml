[package]
name = "rom-ingest-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rom_ingest_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1.10"
sha1 = "0.10"
trash = "5.2"
thiserror = "2.0"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2" }
